<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinch Payments - Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .home {
            background: #16213e;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #0f3460;
            text-align: center;
        }
        .home .logo {
            font-size: 42px;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 4px;
        }
        .home .welcome {
            color: #fff;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .home .welcome span {
            color: #4fc3f7;
        }
        .home .divider {
            border: none;
            border-top: 1px solid #2a2a5a;
            margin: 20px 0;
        }
        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-grid .row {
            display: flex;
            gap: 12px;
        }
        .btn-grid .row .btn {
            flex: 1;
        }
        .btn {
            display: block;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #4fc3f7; color: #0a0a1a; }
        .btn-primary:hover { background: #29b6f6; }
        .btn-secondary { background: #1a237e; color: white; }
        .btn-secondary:hover { background: #0d1555; }
        .btn-success { background: #4caf50; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-orange { background: #ff9800; color: white; }
        .btn-orange:hover { background: #e68900; }
        .btn-purple { background: #7b1fa2; color: white; }
        .btn-purple:hover { background: #6a1b9a; }
        .btn-outline { background: transparent; color: #4fc3f7; border: 2px solid #4fc3f7; }
        .btn-outline:hover { background: #4fc3f7; color: #0a0a1a; }
        .btn-small { padding: 10px 16px; font-size: 13px; }
        .btn-large { padding: 20px 24px; font-size: 18px; }
        .badge {
            display: inline-block;
            background: #0f3460;
            color: #4fc3f7;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
        }
        .footer-links {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .footer-links a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.3s;
        }
        .footer-links a:hover { color: #4fc3f7; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            margin-right: 6px;
        }
        @media (max-width: 480px) {
            .home { padding: 24px 16px; }
            .btn-grid .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="home">
    <div class="logo">💳 PINCH</div>
    
    <hr class="divider">
    
    <div class="welcome">Welcome to <span>Pinch Receipt</span> App</div>
    <p style="color: #8888aa; font-size: 13px; margin-bottom: 20px;">
        <span class="status-dot"></span> System Online
    </p>

    <div class="btn-grid">
        <!-- Big Buttons -->
        <div class="row">
            <a href="/eftpos.html" class="btn btn-primary btn-large">📱 EFTPOS Simulator</a>
        </div>
        <div class="row">
            <a href="/demo.html" class="btn btn-secondary btn-large">🧾 Customer App</a>
        </div>
        
        <hr class="divider">
        
        <!-- Mini Buttons -->
        <div class="row">
            <a href="/receipts/dashboard" class="btn btn-orange btn-small">📊 Dashboard</a>
            <a href="/receipts" class="btn btn-purple btn-small">📋 JSON Receipts</a>
        </div>
    </div>

    <hr class="divider">

    <div class="footer-links">
        <a href="/">🏠 Home</a>
        <a href="/eftpos.html">📱 EFTPOS</a>
        <a href="/demo.html">🧾 Customer</a>
        <a href="/receipts/dashboard">📊 Dashboard</a>
    </div>

    <p style="color: #444; font-size: 11px; margin-top: 16px;">
        Pinch Me Hackathon 2026 · v2.0
    </p>
</div>

</body>
</html>

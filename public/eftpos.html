<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EFTPOS Simulator - Staff</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .eftpos {
            background: #16213e;
            border-radius: 32px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #0f3460;
        }
        .eftpos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .eftpos-header .brand { font-weight: 700; font-size: 18px; color: #e94560; }
        .eftpos-header .status { font-size: 12px; background: #0f3460; padding: 4px 12px; border-radius: 20px; color: #4fc3f7; }
        .eftpos-screen {
            background: #0a0a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #1a1a3e;
            min-height: 300px;
        }
        .eftpos-screen .label { color: #8888aa; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .eftpos-screen .value-input {
            background: #0d0d2b;
            border: 1px solid #2a2a5a;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
        }
        .eftpos-screen .value-input:focus { outline: none; border-color: #e94560; }
        .eftpos-screen .amount-display {
            font-size: 32px;
            font-weight: bold;
            color: #4fc3f7;
            text-align: center;
            padding: 10px 0;
            font-family: 'Courier New', monospace;
        }
        .eftpos-screen .amount-display .currency { font-size: 18px; color: #666; }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
        }
        .item-row input {
            background: #0d0d2b;
            border: 1px solid #2a2a5a;
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            width: 100%;
            font-family: 'Courier New', monospace;
        }
        .item-row input:focus { outline: none; border-color: #e94560; }
        .item-row .remove-btn {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-add-item {
            background: transparent;
            color: #4fc3f7;
            border: 1px dashed #4fc3f7;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        .btn-add-item:hover { background: rgba(79,195,247,0.1); }

        .btn-generate {
            background: #4fc3f7;
            color: #0a0a1a;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-generate:active { transform: scale(0.98); }
        .btn-generate:disabled { background: #555; color: #999; cursor: not-allowed; }
        .btn-generate.processing { background: #f57c00; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .btn-reset {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }

        .result-box {
            background: #0a0a1a;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #1a3a3a;
            display: none;
        }
        .result-box.success { border-color: #4caf50; display: block; }
        .result-box.error { border-color: #e94560; display: block; }
        .result-box .result-label { color: #888; font-size: 11px; }
        .result-box .result-value { color: #fff; font-size: 12px; font-family: monospace; word-break: break-all; }

        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #1b5e20; color: #81c784; }
        .badge-red { background: #b71c1c; color: #ef9a9a; }
        .badge-blue { background: #0d47a1; color: #64b5f6; }

        .form-section { margin-bottom: 12px; }
        .form-section .section-title {
            color: #8888aa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1a1a3e;
            padding-bottom: 4px;
        }

        .flex-row { display: flex; gap: 8px; }
        .flex-row .flex-1 { flex: 1; }

        /* QR Code Section */
        #qrSection {
            display: none;
            margin-top: 16px;
            text-align: center;
            background: #0a0a1a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #2a2a5a;
        }
        #qrSection .qr-title {
            color: #4fc3f7;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        #qrCode {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
        }
        #qrCode img {
            display: block;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }
        #qrCode .qr-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        #qrCode .qr-invoice-id {
            font-size: 11px;
            color: #1a1a2e;
            font-family: monospace;
            word-break: break-all;
            max-width: 180px;
            font-weight: 600;
            margin-top: 4px;
        }

        .copy-btn {
            background: transparent;
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
            padding: 6px 16px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:hover { background: rgba(79,195,247,0.1); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; }
        .toast.success { border-color: #4caf50; }
        .toast.error { border-color: #e94560; }

        /* Payment Done Section */
        #paymentDoneSection {
            display: none;
            margin-top: 16px;
            text-align: center;
            background: #0a0a1a;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #4caf50;
        }
        #paymentDoneSection .done-icon { font-size: 48px; margin-bottom: 8px; }
        #paymentDoneSection .done-title { color: #4caf50; font-size: 20px; font-weight: 700; }
        #paymentDoneSection .done-sub { color: #8888aa; font-size: 13px; margin-top: 4px; }
        #paymentDoneSection .done-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-back {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .btn-back:hover { opacity: 0.85; transform: scale(0.97); }
        .btn-back:active { transform: scale(0.95); }
        .btn-back-home { background: #4fc3f7; color: #0a0a1a; }
        .btn-back-new { background: #4caf50; color: white; }

        @media (max-width: 480px) {
            .eftpos { padding: 16px; }
            .eftpos-screen { padding: 14px; }
            .item-row { grid-template-columns: 1.5fr 0.8fr 0.8fr 0.5fr; gap: 4px; }
            .item-row input { font-size: 11px; padding: 4px 6px; }
            #qrCode img { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

<div class="eftpos" id="eftposApp">
    <div class="eftpos-header">
        <span class="brand">💳 PINCH EFTPOS</span>
        <span class="status" id="connectionStatus">● Online</span>
    </div>

    <div class="eftpos-screen" id="eftposScreen">
        <div class="label">💳 GENERATE PAYMENT</div>
        <div class="amount-display">
            <span class="currency">AUD</span>
            <span id="totalDisplay">0.00</span>
        </div>

        <div class="form-section">
            <div class="section-title">🏪 Store Details</div>
            <div class="flex-row">
                <div class="flex-1">
                    <div class="label">Store Name</div>
                    <input class="value-input" id="storeName" value="Bunnings Warehouse" placeholder="Store name">
                </div>
                <div class="flex-1">
                    <div class="label">Store Email</div>
                    <input class="value-input" id="storeEmail" value="receipts@bunnings.com.au" placeholder="Email">
                </div>
            </div>
            <div class="flex-row">
                <div class="flex-1">
                    <div class="label">Staff Name</div>
                    <input class="value-input" id="staffName" value="John Smith" placeholder="Staff name">
                </div>
                <div class="flex-1">
                    <div class="label">Staff Phone</div>
                    <input class="value-input" id="staffPhone" value="0400 123 456" placeholder="Phone">
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">📦 Items</div>
            <div id="itemsContainer"></div>
            <button class="btn-add-item" id="addItemBtn">+ Add Item</button>
        </div>

        <div class="form-section">
            <div class="section-title">🧾 Tax</div>
            <div class="flex-row">
                <div class="flex-1">
                    <div class="label">GST Rate (%)</div>
                    <input class="value-input" id="gstRate" value="10" placeholder="10" type="number">
                </div>
                <div class="flex-1">
                    <div class="label">GST Amount (AUD)</div>
                    <input class="value-input" id="gstAmount" value="0.00" placeholder="0.00" type="number" step="0.01" readonly>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">📄 Invoice</div>
            <div class="flex-row">
                <div class="flex-1">
                    <div class="label">Invoice Number</div>
                    <input class="value-input" id="invoiceNumber" placeholder="Invoice #">
                </div>
                <div class="flex-1">
                    <div class="label">Reference</div>
                    <input class="value-input" id="reference" placeholder="Reference">
                </div>
            </div>
        </div>

        <!-- QR CODE SECTION -->
        <div id="qrSection">
            <div class="qr-title">📱 SCAN WITH CUSTOMER APP</div>
            <div id="qrCode">
                <div id="qrcode"></div>
                <div class="qr-label">INVOICE</div>
                <div class="qr-invoice-id" id="qrInvoiceId">-</div>
            </div>
            <button class="copy-btn" id="copyInvoiceBtn">📋 Copy Invoice ID</button>
        </div>

        <!-- PAYMENT DONE SECTION -->
        <div id="paymentDoneSection">
            <div class="done-icon">✅</div>
            <div class="done-title">Payment Done!</div>
            <div class="done-sub">The payment has been successfully processed.</div>
            <div class="done-actions">
                <button class="btn-back btn-back-home" id="backToHomeBtn">🏠 Back to Home</button>
                <button class="btn-back btn-back-new" id="newPaymentBtn">💳 New Payment</button>
            </div>
        </div>

        <!-- RESULT BOX -->
        <div class="result-box" id="resultBox">
            <div class="result-label" id="resultLabel">Result</div>
            <div class="result-value" id="resultValue">-</div>
        </div>
    </div>

    <button class="btn-generate" id="generateBtn">📄 GENERATE PAYMENT QR</button>
    <button class="btn-reset" id="resetBtn">↺ Reset to Defaults</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ============================================================
    // STATE
    // ============================================================
    let items = [
        { name: 'Hammer', qty: 1, price: 25.00 },
        { name: 'Paint', qty: 2, price: 10.00 },
        { name: 'Tape', qty: 1, price: 5.00 }
    ];

    const DEFAULT_ITEMS = [
        { name: 'Hammer', qty: 1, price: 25.00 },
        { name: 'Paint', qty: 2, price: 10.00 },
        { name: 'Tape', qty: 1, price: 5.00 }
    ];

    const $ = id => document.getElementById(id);
    const API_BASE = window.location.origin;
    let currentQrCode = null;
    let paymentCheckInterval = null;

    // ============================================================
    // UPDATE TOTAL — COMPLETE FIX
    // ============================================================
    function updateTotal() {
        let subtotal = 0;
        items.forEach(item => {
            const qty = parseFloat(item.qty) || 0;
            const price = parseFloat(item.price) || 0;
            subtotal += qty * price;
        });
        
        const gstRate = parseFloat($('gstRate').value) || 0;
        const gstAmount = subtotal * (gstRate / 100);
        const total = subtotal + gstAmount;
        
        $('totalDisplay').textContent = total.toFixed(2);
        $('gstAmount').value = gstAmount.toFixed(2);
        
        return total;
    }

    // ============================================================
    // RENDER ITEMS — FIXED EVENT LISTENERS
    // ============================================================
    function renderItems() {
        const container = $('itemsContainer');
        container.innerHTML = '';
        
        items.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input class="item-name" value="${item.name}" placeholder="Item" data-index="${index}">
                <input class="item-qty" value="${item.qty}" placeholder="Qty" type="number" data-index="${index}">
                <input class="item-price" value="${item.price.toFixed(2)}" placeholder="Price" type="number" step="0.01" data-index="${index}">
                <button class="remove-btn" data-index="${index}">✕</button>
            `;
            container.appendChild(row);
        });

        container.querySelectorAll('.item-name, .item-qty, .item-price').forEach(el => {
            el.addEventListener('input', function() {
                const idx = parseInt(this.dataset.index);
                if (this.classList.contains('item-name')) {
                    items[idx].name = this.value;
                } else if (this.classList.contains('item-qty')) {
                    items[idx].qty = parseFloat(this.value) || 0;
                } else if (this.classList.contains('item-price')) {
                    items[idx].price = parseFloat(this.value) || 0;
                }
                updateTotal();
            });
            el.addEventListener('change', updateTotal);
        });

        container.querySelectorAll('.remove-btn').forEach(el => {
            el.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                items.splice(idx, 1);
                renderItems();
                updateTotal();
            });
        });

        updateTotal();
    }

    // ============================================================
    // ADD ITEM
    // ============================================================
    $('addItemBtn').addEventListener('click', () => {
        items.push({ name: 'New Item', qty: 1, price: 0.00 });
        renderItems();
        const inputs = document.querySelectorAll('.item-name');
        if (inputs.length > 0) {
            inputs[inputs.length - 1].focus();
        }
        updateTotal();
    });

    // ============================================================
    // GST RATE CHANGE
    // ============================================================
    $('gstRate').addEventListener('input', updateTotal);
    $('gstRate').addEventListener('change', updateTotal);

    // ============================================================
    // SHOW PAYMENT DONE
    // ============================================================
    function showPaymentDone() {
        document.getElementById('qrSection').style.display = 'none';
        document.getElementById('paymentDoneSection').style.display = 'block';
        document.getElementById('generateBtn').disabled = true;
        document.getElementById('generateBtn').textContent = '✅ PAID';
        document.getElementById('connectionStatus').textContent = '✅ Payment Done';
        
        // Clear any polling interval
        if (paymentCheckInterval) {
            clearInterval(paymentCheckInterval);
            paymentCheckInterval = null;
        }
    }

    // ============================================================
    // BACK TO HOME
    // ============================================================
    document.getElementById('backToHomeBtn').addEventListener('click', function() {
        window.location.href = '/';
    });

    // ============================================================
    // NEW PAYMENT
    // ============================================================
    document.getElementById('newPaymentBtn').addEventListener('click', function() {
        // Reset the form
        document.getElementById('paymentDoneSection').style.display = 'none';
        document.getElementById('qrSection').style.display = 'none';
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('generateBtn').textContent = '📄 GENERATE PAYMENT QR';
        document.getElementById('connectionStatus').textContent = '● Online';
        document.getElementById('resultBox').className = 'result-box';
        document.getElementById('resultBox').style.display = 'none';
        
        // Clear QR code
        if (currentQrCode) {
            document.getElementById('qrcode').innerHTML = '';
            currentQrCode = null;
        }
        
        // Reset items to defaults
        items = DEFAULT_ITEMS.map(i => ({ ...i }));
        renderItems();
        updateTotal();
        showToast('🔄 Ready for new payment', 'success');
    });

    // ============================================================
    // RESET
    // ============================================================
    $('resetBtn').addEventListener('click', () => {
        items = DEFAULT_ITEMS.map(i => ({ ...i }));
        renderItems();
        $('storeName').value = 'Bunnings Warehouse';
        $('storeEmail').value = 'receipts@bunnings.com.au';
        $('staffName').value = 'John Smith';
        $('staffPhone').value = '0400 123 456';
        $('gstRate').value = '10';
        $('invoiceNumber').value = `INV-${Date.now().toString().slice(-6)}`;
        $('reference').value = `REF-${Date.now().toString().slice(-6)}`;
        document.getElementById('qrSection').style.display = 'none';
        document.getElementById('paymentDoneSection').style.display = 'none';
        const resultBox = $('resultBox');
        resultBox.className = 'result-box';
        resultBox.style.display = 'none';
        $('generateBtn').disabled = false;
        $('generateBtn').textContent = '📄 GENERATE PAYMENT QR';
        $('generateBtn').className = 'btn-generate';
        $('connectionStatus').textContent = '● Online';
        if (currentQrCode) {
            document.getElementById('qrcode').innerHTML = '';
            currentQrCode = null;
        }
        if (paymentCheckInterval) {
            clearInterval(paymentCheckInterval);
            paymentCheckInterval = null;
        }
        updateTotal();
        showToast('🔄 Reset to defaults', 'success');
    });

    // ============================================================
    // GENERATE PINCH PAYMENT LINK & QR CODE
    // ============================================================
    $('generateBtn').addEventListener('click', async () => {
        if ($('generateBtn').disabled) return;

        const storeName = $('storeName').value || 'Store';
        const storeEmail = $('storeEmail').value || 'store@example.com';
        const staffName = $('staffName').value || 'Staff';
        const staffPhone = $('staffPhone').value || 'N/A';
        const invoiceNumber = $('invoiceNumber').value || `INV-${Date.now().toString().slice(-6)}`;
        const reference = $('reference').value || `REF-${Date.now().toString().slice(-6)}`;
        const gstRate = parseFloat($('gstRate').value) || 10;

        let subtotal = 0;
        const lineItems = [];
        items.forEach(item => {
            const qty = parseFloat(item.qty) || 0;
            const price = parseFloat(item.price) || 0;
            const total = qty * price;
            subtotal += total;
            lineItems.push({
                description: item.name || 'Item',
                amount: Math.round(price * 100),
                quantity: qty
            });
        });

        const gstAmount = subtotal * (gstRate / 100);
        const total = subtotal + gstAmount;

        if (total < 1) {
            showToast('⚠️ Total amount must be at least $1.00', 'error');
            return;
        }

        $('generateBtn').disabled = true;
        $('generateBtn').textContent = '⏳ GENERATING...';
        $('generateBtn').className = 'btn-generate processing';
        $('connectionStatus').textContent = '⏳ Generating...';

        const resultBox = $('resultBox');
        resultBox.className = 'result-box';
        resultBox.style.display = 'none';

        try {
            const payload = {
                storeName,
                storeEmail,
                staffName,
                staffPhone,
                invoiceNumber,
                reference,
                items: lineItems,
                subtotal: Math.round(subtotal * 100),
                gstAmount: Math.round(gstAmount * 100),
                total: Math.round(total * 100),
                gstRate
            };

            const response = await fetch(`${API_BASE}/create-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                console.error('❌ Server error:', data);
                throw new Error(data.error || 'Failed to create payment');
            }

            console.log('✅ Payment link created:', data);

            const qrSection = document.getElementById('qrSection');
            qrSection.style.display = 'block';
            document.getElementById('qrInvoiceId').textContent = data.invoiceNumber || invoiceNumber;

            document.getElementById('qrcode').innerHTML = '';

            currentQrCode = new QRCode(document.getElementById("qrcode"), {
                text: data.checkoutUrl || data.qrData,
                width: 200,
                height: 200,
                colorDark: "#1a237e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            resultBox.className = 'result-box success';
            resultBox.style.display = 'block';
            document.getElementById('resultLabel').textContent = '✅ Payment QR Generated!';
            document.getElementById('resultValue').innerHTML = `
                Invoice: <strong>${data.invoiceNumber || invoiceNumber}</strong><br>
                Amount: ${data.currency || 'AUD'} $${(data.total / 100).toFixed(2)}<br>
                <span style="color:#4fc3f7;">📱 Scan QR code with customer app to pay</span>
            `;

            $('generateBtn').textContent = '⏳ WAITING FOR PAYMENT...';
            $('generateBtn').className = 'btn-generate processing';
            $('connectionStatus').textContent = '⏳ Waiting for payment...';

            // Start polling for payment status
            startPaymentPolling(data.paymentLinkId);

            showToast('✅ QR Code generated! Scan with customer app.', 'success');

        } catch (error) {
            console.error('❌ Payment generation failed:', error);
            resultBox.className = 'result-box error';
            resultBox.style.display = 'block';
            document.getElementById('resultLabel').textContent = '❌ Generation Failed';
            document.getElementById('resultValue').textContent = error.message;
            $('generateBtn').textContent = '📄 RETRY';
            $('generateBtn').className = 'btn-generate';
            $('generateBtn').disabled = false;
            $('connectionStatus').textContent = '❌ Error';
            showToast('❌ ' + error.message, 'error');
        }
    });

    // ============================================================
    // POLL FOR PAYMENT STATUS
    // ============================================================
    function startPaymentPolling(paymentLinkId) {
        if (paymentCheckInterval) {
            clearInterval(paymentCheckInterval);
        }

        let attempts = 0;
        const maxAttempts = 30;

        paymentCheckInterval = setInterval(async () => {
            attempts++;

            try {
                const response = await fetch(`${API_BASE}/check-payment/${paymentLinkId}`);
                const data = await response.json();

                console.log(`📊 Poll attempt ${attempts}:`, data.status);

                if (data.success && data.status === 'approved') {
                    // Payment approved!
                    clearInterval(paymentCheckInterval);
                    paymentCheckInterval = null;
                    showPaymentDone();
                    showToast('✅ Payment received!', 'success');
                    return;
                }

                if (data.success && (data.status === 'failed' || data.status === 'declined')) {
                    clearInterval(paymentCheckInterval);
                    paymentCheckInterval = null;
                    $('generateBtn').textContent = '📄 RETRY';
                    $('generateBtn').className = 'btn-generate';
                    $('generateBtn').disabled = false;
                    $('connectionStatus').textContent = '❌ Payment Failed';
                    showToast('❌ Payment failed. Please try again.', 'error');
                    return;
                }

                if (attempts >= maxAttempts) {
                    clearInterval(paymentCheckInterval);
                    paymentCheckInterval = null;
                    $('generateBtn').textContent = '📄 CHECK STATUS';
                    $('generateBtn').className = 'btn-generate';
                    $('generateBtn').disabled = false;
                    $('connectionStatus').textContent = '⏳ Timeout';
                    showToast('⏳ Payment still processing. Check dashboard.', '');
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }, 3000);
    }

    // ============================================================
    // COPY INVOICE ID
    // ============================================================
    document.getElementById('copyInvoiceBtn').addEventListener('click', () => {
        const invoiceId = document.getElementById('qrInvoiceId').textContent;
        if (invoiceId && invoiceId !== '-') {
            navigator.clipboard?.writeText(invoiceId).then(() => {
                showToast('📋 Invoice ID copied!', 'success');
            }).catch(() => {
                prompt('Copy this invoice ID:', invoiceId);
            });
        } else {
            showToast('No invoice to copy', 'error');
        }
    });

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimeout;

    function showToast(message, type = '') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.className = 'toast';
        }, 4000);
    }

    // ============================================================
    // INIT
    // ============================================================
    renderItems();
    $('invoiceNumber').value = `INV-${Date.now().toString().slice(-6)}`;
    $('reference').value = `REF-${Date.now().toString().slice(-6)}`;
    updateTotal();

    console.log('💳 EFTPOS Simulator loaded at:', API_BASE);
    console.log('📱 Customer app: open demo.html on another device');
</script>
</body>
</html>
